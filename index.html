<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameSlot Pro</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050914;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      border: 0;
    }
  </style>
</head>

<body>
  <iframe
    id="gameslot-app"
    src="https://gameslotpro.streamlit.app/?embed=true"
    allow="clipboard-read; clipboard-write; fullscreen">
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);

    if (params.size > 0) {
      params.set("embed", "true");

      document.getElementById("gameslot-app").src =
        "https://gameslotpro.streamlit.app/?" + params.toString();
    }
  </script>
</body>
</html>
